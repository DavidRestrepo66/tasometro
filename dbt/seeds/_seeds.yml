version: 2

seeds:
  - name: tpm_cambios
    description: >
      Banco de la República policy rate (SUAMECA series 59), one row per change
      date. Effective annual, base 365. Updated by hand; see the README.
    config:
      column_types: {fecha_cambio: date, tpm: "numeric(6, 2)"}
    columns:
      - name: fecha_cambio
        data_tests: [unique, not_null]
      - name: tpm
        data_tests:
          - not_null
          - valores_en_rango:
              arguments: {min_value: 0, max_value: 50}

  - name: plazo_bandas
    description: >
      Maps every raw plazo_de_cr_dito label to a canonical term band. A band
      holds the label's upper bound; open-ended labels go by their lower bound.
      es_aproximado marks labels that straddle two bands.
    config:
      column_types: {plazo_banda_orden: integer, es_aproximado: boolean}
    columns:
      - name: plazo_raw
        data_tests: [unique, not_null]
      - name: plazo_banda
        data_tests:
          - accepted_values:
              arguments:
                values: ["Hasta 1 año", "1 a 3 años", "3 a 5 años", "Más de 5 años", "Sin plazo"]

  - name: tipo_tasa_clases
    description: >
      Classifies every tipo_de_tasa. Only en_spread rates are compared with the
      TPM; real rates (UVR, IPC) are not. es_ambigua marks types whose meaning
      the source does not define; they enter the spread but are flagged.
    config:
      column_types: {en_spread: boolean, es_ambigua: boolean}
    columns:
      - name: tipo_de_tasa
        data_tests: [unique, not_null]
      - name: clase_tasa
        data_tests:
          - accepted_values:
              arguments:
                values: ["Fija", "Indexada", "Otra", "Real"]
